<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Lumen scenes preview</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #e8e8e8; --dim: #8a8a8a; --line: #222; --accent: #5cff97; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  select, button, label { font: inherit; color: var(--fg); }
  select, button, .file { background: #111; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .file input { display: none; }
  button:hover { border-color: var(--accent); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100vh - 140px); margin: 0 auto; background: #000; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .info { padding: 10px 16px; color: var(--dim); }
  .err { color: #9fd8b8; white-space: pre-wrap; padding: 10px 16px; }
</style>
</head>
<body>
<header>
  <h1>Lumen scenes</h1>
  <select id="pick" aria-label="Scene"></select>
  <button id="music" type="button">Play music</button>
  <label class="file">My own MIDI… <input id="own" type="file" accept=".mid,.midi,audio/midi"></label>
  <label>Volume <input id="vol" type="range" min="5" max="100" value="35"> <span id="volv">35%</span></label>
  <label><input id="scrim" type="checkbox" checked> Lumen dashboard scrim</label>
</header>
<div class="stage"><canvas id="c"></canvas></div>
<div class="info" id="info"></div>
<div class="err" id="err"></div>
<script type="module">
import { loadScene, ScenePlayer } from './lumen-scene.mjs';
import { renderMidi, playRendered, prepareMidi } from './lumen-synth.mjs';

const $ = (id) => document.getElementById(id);
const index = await (await fetch('../index.json')).json();
const qs = new URLSearchParams(location.search);
for (const s of index.scenes) $('pick').add(new Option(`${s.name} (${s.games.map((g) => g.title).join(', ')})`, s.id));
if (qs.get('scene')) $('pick').value = qs.get('scene');
let stop = () => {}, stopMusic = null, loaded = null, player = null, ctx = null, own = null;

async function open(id) {
  stop(); stopMusic?.(); stopMusic = null; $('music').textContent = 'Play music'; $('err').textContent = '';
  try {
    loaded = await loadScene(async (p) => {
      const r = await fetch(`../scenes/${id}/${p}`);
      if (!r.ok) throw new Error(`missing file: ${p}`);
      return new Uint8Array(await r.arrayBuffer());
    });
    const c = $('c').cloneNode(); $('c').replaceWith(c);
    player = new ScenePlayer(c, loaded, { scrim: $('scrim').checked ? 0.45 : -1 });
    stop = player.start();
    const s = loaded.scene;
    $('info').textContent = `${s.name} by ${s.author} (${s.license}) · ${loaded.triangles} triangles · ${loaded.files.length} files · ${s.description ?? ''}`;
    history.replaceState(null, '', `?scene=${id}`);
  } catch (e) { $('err').textContent = String(e.message ?? e); }
}
$('pick').onchange = () => open($('pick').value);
$('scrim').onchange = () => { if (player) player.scrim = $('scrim').checked ? 0.45 : -1; };
async function play() {
  stopMusic?.(); stopMusic = null;
  const midi = own ?? loaded?.midi;
  if (!midi) { $('err').textContent = 'This scene has no music.'; return; }
  ctx ??= new AudioContext();
  await ctx.resume();
  const t0 = performance.now();
  // your own MIDI goes through the same preparation as the web import: trimmed, one pass, volume baked in
  const prep = own ? prepareMidi(own, { volume: $('vol').value / 100 }) : null;
  const r = renderMidi(prep ? prep.bytes : midi);
  stopMusic = playRendered(ctx, r, { volume: prep ? 1 : (loaded.scene.music.volume ?? 0.8) });
  $('music').textContent = 'Stop music';
  $('err').textContent = `${own ? 'Your MIDI' : 'Scene music'}: ${r.seconds.toFixed(1)} s, loop from ${(r.loopStart / r.rate).toFixed(1)} s`
    + (prep?.trimmedSeconds > 1 ? `, ${Math.round(prep.trimmedSeconds)} s of repeats/leftovers removed` : '')
    + ` (rendered in ${Math.round(performance.now() - t0)} ms)`;
}
$('music').onclick = async () => {
  if (stopMusic) { stopMusic(); stopMusic = null; $('music').textContent = 'Play music'; return; }
  await play();
};
$('own').onchange = async (ev) => {
  const f = ev.target.files?.[0];
  if (!f) return;
  try { own = new Uint8Array(await f.arrayBuffer()); prepareMidi(own); await play(); }
  catch (e) { own = null; $('err').textContent = `Not a usable MIDI: ${e.message}`; }
};
$('vol').oninput = () => { $('volv').textContent = $('vol').value + '%'; };
$('vol').onchange = () => { if (own && stopMusic) play(); };
if (index.scenes.length) open($('pick').value);
</script>
</body>
</html>
